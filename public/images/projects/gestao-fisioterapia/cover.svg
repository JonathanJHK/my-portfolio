  <text x="915" y="470" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">shared</text>
  <text x="915" y="498" text-anchor="middle" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="15">componentes</text>
  <text x="915" y="520" text-anchor="middle" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="15">services · validators</text>

  <rect x="1120" y="245" width="380" height="325" rx="24" fill="#FFFAF2" stroke="#DED3C4" stroke-width="2"/>
