<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura da plataforma de gestão para fisioterapia</title>
  <desc id="description">Fluxo entre perfis de acesso, aplicação Angular 17 organizada em core, features e shared, e API REST em Spring Boot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B84628"/>
    </marker>
  </defs>

  <rect width="1600" height="900" rx="36" fill="#F6F1E9"/>
  <text x="100" y="100" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Arquitetura da solução</text>
  <text x="100" y="145" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="23">Plataforma de gestão de atendimentos em fisioterapia</text>

  <rect x="100" y="245" width="275" height="325" rx="24" fill="#211D18"/>
  <text x="237" y="302" text-anchor="middle" fill="#F2D4C8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">PERFIS DE ACESSO</text>
  <rect x="137" y="345" width="200" height="55" rx="16" fill="#39322B"/>
  <rect x="137" y="425" width="200" height="55" rx="16" fill="#39322B"/>
  <rect x="137" y="505" width="200" height="55" rx="16" fill="#39322B"/>
  <text x="237" y="380" text-anchor="middle" fill="#FFFAF2" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Administrador</text>
  <text x="237" y="460" text-anchor="middle" fill="#FFFAF2" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Profissional</text>
  <text x="237" y="540" text-anchor="middle" fill="#FFFAF2" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Cliente</text>

  <rect x="475" y="210" width="545" height="420" rx="24" fill="#FFFAF2" stroke="#DED3C4" stroke-width="2"/>
  <rect x="510" y="245" width="132" height="38" rx="19" fill="#F2D4C8"/>
  <text x="576" y="271" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">FRONT-END</text>
  <text x="510" y="340" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Angular 17</text>
  <text x="510" y="385" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">PrimeNG · PrimeFlex · RxJS</text>

  <rect x="510" y="425" width="138" height="120" rx="18" fill="#F6F1E9" stroke="#DED3C4" stroke-width="2"/>
  <rect x="678" y="425" width="138" height="120" rx="18" fill="#F6F1E9" stroke="#DED3C4" stroke-width="2"/>
  <rect x="846" y="425" width="138" height="120" rx="18" fill="#F6F1E9" stroke="#DED3C4" stroke-width="2"/>
  <text x="579" y="470" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">core</text>
  <text x="579" y="502" text-anchor="middle" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="16">guards</text>
  <text x="579" y="526" text-anchor="middle" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="16">interceptors</text>
  <text x="747" y="470" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">features</text>
