  <text x="1155" y="422" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">API REST</text>
  <text x="1155" y="462" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Autenticação e perfis</text>
  <text x="1155" y="502" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Regras e dados do produto</text>

  <path d="M 375 405 L 475 405" fill="none" stroke="#B84628" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 1020 405 L 1120 405" fill="none" stroke="#B84628" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1070" y="380" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">API REST</text>

  <rect x="100" y="690" width="900" height="115" rx="24" fill="#F2D4C8" stroke="#D8B4A5" stroke-width="2"/>
  <text x="135" y="735" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">MINHA ATUAÇÃO</text>
  <text x="135" y="775" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Implementação de praticamente todo o Front-end a partir do design fornecido</text>

  <rect x="1080" y="690" width="420" height="115" rx="24" fill="#211D18"/>
  <text x="1290" y="735" text-anchor="middle" fill="#F2D4C8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">FLUXOS PRINCIPAIS</text>
  <text x="1290" y="775" text-anchor="middle" fill="#FFFAF2" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Agenda · serviços · produtos · perfis</text>
