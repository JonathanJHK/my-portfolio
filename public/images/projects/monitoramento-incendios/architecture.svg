  <path d="M 865 405 L 970 405" fill="none" stroke="#B84628" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="918" y="380" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">API REST</text>
  <path d="M 1170 600 L 1170 652 L 1325 652 L 1325 690" fill="none" stroke="#B84628" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="1325" y="735" text-anchor="middle" fill="#F2D4C8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">PERSISTÊNCIA</text>
  <text x="1325" y="775" text-anchor="middle" fill="#FFFAF2" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">PostgreSQL</text>

  <rect x="465" y="690" width="545" height="115" rx="24" fill="#F2D4C8" stroke="#D8B4A5" stroke-width="2"/>
  <text x="500" y="735" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">MINHA ATUAÇÃO</text>
  <text x="500" y="775" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Design + Front-end completo + evolução do Back-end</text>
