<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do sistema de emissão de notas fiscais</title>
  <desc id="description">Fluxo entre a aplicação Angular, os microsserviços de Faturamento e Estoque e seus bancos PostgreSQL separados.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B84628"/></marker></defs>
  <rect width="1600" height="900" rx="36" fill="#F6F1E9"/>
  <text x="100" y="100" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Arquitetura da solução</text>
  <text x="100" y="145" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="23">Desafio Korp · Angular e microsserviços .NET</text>

  <rect x="100" y="235" width="380" height="335" rx="24" fill="#FFFAF2" stroke="#DED3C4" stroke-width="2"/>
  <rect x="610" y="235" width="380" height="335" rx="24" fill="#FFFAF2" stroke="#DED3C4" stroke-width="2"/>
  <rect x="1120" y="235" width="380" height="335" rx="24" fill="#FFFAF2" stroke="#DED3C4" stroke-width="2"/>

  <rect x="132" y="267" width="132" height="38" rx="19" fill="#F2D4C8"/>
  <text x="198" y="293" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">FRONT-END</text>
  <text x="132" y="355" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Angular 20</text>
  <text x="132" y="402" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Produtos e notas fiscais</text>
  <text x="132" y="442" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Reactive Forms + FormArray</text>
  <text x="132" y="482" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Signals, RxJS e Lazy Loading</text>
  <text x="132" y="522" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">PrimeNG + Tailwind CSS</text>

  <rect x="642" y="267" width="116" height="38" rx="19" fill="#F2D4C8"/>
  <text x="700" y="293" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">SERVIÇO</text>
  <text x="642" y="355" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Faturamento.Api</text>
  <text x="642" y="402" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Criação e consulta de notas</text>
  <text x="642" y="442" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Fechamento e impressão</text>
  <text x="642" y="482" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Cliente HTTP tipado</text>
  <text x="642" y="522" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">ProblemDetails e exceções</text>

  <rect x="1152" y="267" width="116" height="38" rx="19" fill="#F2D4C8"/>
  <text x="1210" y="293" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">SERVIÇO</text>
  <text x="1152" y="355" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Estoque.Api</text>
  <text x="1152" y="402" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Produtos e saldos</text>
  <text x="1152" y="442" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Validação e baixa de estoque</text>
  <text x="1152" y="482" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Transação e atomicidade</text>
  <text x="1152" y="522" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="20">Chave de idempotência</text>

  <path d="M 480 400 L 610 400" fill="none" stroke="#B84628" stroke-width="5" marker-end="url(#arrow)"/><text x="545" y="380" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">API REST</text>
  <path d="M 990 400 L 1120 400" fill="none" stroke="#B84628" stroke-width="5" marker-end="url(#arrow)"/><text x="1055" y="365" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">HTTP</text><text x="1055" y="388" text-anchor="middle" fill="#8E321D" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">TIPADO</text>
  <path d="M 800 570 L 800 655" fill="none" stroke="#B84628" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1310 570 L 1310 655" fill="none" stroke="#B84628" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="610" y="670" width="380" height="120" rx="24" fill="#211D18"/><rect x="1120" y="670" width="380" height="120" rx="24" fill="#211D18"/>
  <text x="800" y="718" text-anchor="middle" fill="#F2D4C8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">BANCO DE FATURAMENTO</text><text x="800" y="760" text-anchor="middle" fill="#FFFAF2" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">PostgreSQL</text>
  <text x="1310" y="718" text-anchor="middle" fill="#F2D4C8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">BANCO DE ESTOQUE</text><text x="1310" y="760" text-anchor="middle" fill="#FFFAF2" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">PostgreSQL</text>
  <text x="100" y="735" fill="#211D18" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Fluxo principal</text>
  <text x="100" y="773" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="18">Criar nota → validar saldo → imprimir</text><text x="100" y="805" fill="#6F6559" font-family="Inter, Arial, sans-serif" font-size="18">→ baixar estoque → fechar nota</text>
</svg>
