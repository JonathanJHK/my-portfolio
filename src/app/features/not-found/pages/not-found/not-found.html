<main class="flex min-h-[70vh] items-center bg-canvas">
  <section
    class="mx-auto w-full max-w-3xl px-6 py-24 text-center"
    aria-labelledby="not-found-title"
  >
    <p class="text-sm font-semibold uppercase tracking-[0.18em] text-accent">Erro 404</p>

    <h1 id="not-found-title" class="mt-4 font-display text-5xl font-bold text-ink sm:text-6xl">
      Página não encontrada
    </h1>

    <p class="mx-auto mt-6 max-w-xl text-lg leading-8 text-muted">
      O endereço acessado não existe ou pode ter sido alterado. Você pode voltar ao início ou
      conhecer os projetos publicados.
    </p>

    <div class="mt-9 flex flex-wrap justify-center gap-4">
      <a
        class="rounded-full bg-accent px-6 py-3 font-semibold text-surface transition-colors hover:bg-accent-dark"
        routerLink="/"
      >
        Voltar ao início
      </a>

      <a
        class="rounded-full border border-line bg-surface px-6 py-3 font-semibold text-ink transition-colors hover:border-accent"
        routerLink="/"
        fragment="projetos"
      >
        Ver projetos
      </a>
    </div>
  </section>
</main>
